services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "80:80"

    depends_on:
      - backend

    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    ports:
      - "8080:8080"

    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - DB_HOST=db

    depends_on:
      - db

    restart: always
  
  db:
    image: postgres:16-alpine

    ports:
      - "${DB_PORT}:5432"

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    
    volumes:
      - db-data:/var/lib/postgresql/data
    
    restart: always
  
volumes:
  db_data:
